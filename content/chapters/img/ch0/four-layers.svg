<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="Tahoma, 'Microsoft YaHei', sans-serif">
  <style>
    .t{font-size:20px;font-weight:700;fill:#0b1220}
    .s{font-size:14px;fill:#4a5262}
    .w{fill:#ffffff}
    .n{font-size:13px;fill:#9a6a12;font-weight:700}
  </style>
  <!-- 第 4 层：你的任务书（琥珀色，代表你） -->
  <rect x="210" y="20" width="340" height="58" rx="8" fill="#fff3d6" stroke="#f5a623" stroke-width="2.5"/>
  <text class="n" x="226" y="43">第 4 层</text>
  <text class="t" x="380" y="47" text-anchor="middle">任务书 · 你来写</text>
  <text class="s" x="380" y="68" text-anchor="middle">lead 读它、按它编排</text>
  <!-- 第 3 层：流水线 -->
  <rect x="165" y="92" width="430" height="58" rx="8" fill="#ffffff" stroke="#e0c58a" stroke-width="2"/>
  <text class="n" x="181" y="115">第 3 层</text>
  <text class="t" x="380" y="119" text-anchor="middle">流水线 · gstack-sprint</text>
  <text class="s" x="380" y="140" text-anchor="middle">8 环、两道闸门、看板</text>
  <!-- 第 2 层：技能库 -->
  <rect x="120" y="164" width="520" height="58" rx="8" fill="#ffffff" stroke="#e0c58a" stroke-width="2"/>
  <text class="n" x="136" y="187">第 2 层</text>
  <text class="t" x="380" y="191" text-anchor="middle">技能库 · gstack</text>
  <text class="s" x="380" y="212" text-anchor="middle">立项、规格、评审、验收等工作方法</text>
  <!-- 第 1 层：Coding Agent -->
  <rect x="75" y="236" width="610" height="58" rx="8" fill="#ffffff" stroke="#e0c58a" stroke-width="2"/>
  <text class="n" x="91" y="259">第 1 层</text>
  <text class="t" x="380" y="263" text-anchor="middle">Coding Agent · DSH</text>
  <text class="s" x="380" y="284" text-anchor="middle">会话、工具、子智能体、批准框</text>
  <!-- 底座：模型 -->
  <rect x="0" y="308" width="760" height="62" rx="8" fill="#0b1220"/>
  <text class="n" x="16" y="331" style="fill:#f5a623">底座</text>
  <text class="t" x="380" y="337" text-anchor="middle" style="fill:#ffffff">模型 · 你接入的</text>
  <text class="s" x="380" y="358" text-anchor="middle" style="fill:#c9cfdb">读、想、写</text>
  <!-- 图注 -->
  <text x="380" y="390" font-size="11.5" fill="#8a8f99" text-anchor="middle">越往上越接近你，越往下越接近“会思考的那部分”</text>
  <text x="380" y="408" font-size="12" fill="#9a6a12" text-anchor="middle">每一层都有多种同类方案可选，本课用的是其中一种组合</text>
</svg>
