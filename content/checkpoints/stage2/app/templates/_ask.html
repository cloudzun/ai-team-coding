{#
  问数面板（规格 4.1）。由 index.html 在指标卡下方 include 进来。
  锚点：data-panel="ask" + data-ask-state；不用 data-view，避免影响 r1 的六视角遍历。
#}
<section class="ask-panel" data-panel="ask" data-ask-state="idle" aria-labelledby="ask-title">
  <div class="ask-head">
    <h2 id="ask-title">问数 <small>一句中文提问 · 只读查询 · 回答里的每个数字都能回到下方 SQL 结果</small></h2>
    <span class="ask-state-msg" data-ask-state-msg>可以提问</span>
  </div>

  <form class="ask-form" data-ask-form autocomplete="off">
    <label class="ask-sr-only" for="ask-input">输入问题</label>
    <input id="ask-input" class="ask-input" type="text" data-ask-input maxlength="200"
           placeholder="例如：2026 年 9 月全公司的入住率是多少？" />
    <button class="ask-submit" type="submit" data-ask-submit>提问</button>
  </form>

  <div class="ask-examples" data-ask-examples aria-label="示例问题">
    <span class="ask-examples-label">试试：</span>
    <button type="button" data-ask-example>2026 年 8 月全公司的平均房价是多少？</button>
    <button type="button" data-ask-example>上城区和滨江区今年三季度入住率差多少？</button>
    <button type="button" data-ask-example>2026 年二季度各渠道订单占比如何？</button>
    <button type="button" data-ask-example>钱塘区 2026 年上半年的入住率为什么比市场基准低？</button>
  </div>

  <div class="ask-body">
    <p class="ask-loading" data-ask-loading hidden>正在查库并生成回答，请稍候（通常几秒）…</p>
    <p class="ask-error" data-ask-error hidden>模型服务不可用，看板其余部分不受影响</p>
    <p class="ask-answer" data-ask-answer aria-live="polite" hidden></p>
    <p class="ask-degraded" data-ask-degraded hidden>已退回模板回答 · 原因：<code data-ask-degrade-reason></code></p>
    <div class="ask-diagnosis" data-ask-diagnosis hidden></div>
    <div class="ask-citations" data-ask-citations hidden></div>
    <details class="ask-steps" data-ask-steps hidden>
      <summary>查看执行的 SQL 与结果（<span data-ask-step-count>0</span> 步）</summary>
      <div class="ask-step-list" data-ask-step-list></div>
    </details>
    <p class="ask-disclaimer" data-ask-disclaimer>回答由模型根据查询结果生成，请以下方数据为准</p>
  </div>
</section>
