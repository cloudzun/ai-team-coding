# 实验页配置：只写路由文字（标题、导语、切片清单），事实全部从章节与同步文件里切。
# 切片规则：
#   chapter + heading   取该章里标题文字恰好等于 heading 的一节（必须命中且只命中一次，否则构建失败）
#   code_match          可选；只取该节里含这些子串的代码块（每个子串必须恰好命中一个代码块）
#   intro: true         可选；只取该节在第一个子标题之前的导语
#   file                取 content/ 下的整份 md 文件（去掉文件首行标题）
